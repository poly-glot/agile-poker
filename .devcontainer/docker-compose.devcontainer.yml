services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    hostname: agilepoker-dev

    volumes:
      - ..:/workspace/agile-poker:cached

    ports:
      - "5173:5173"  # Vite dev server
      - "4000:4000"  # Firebase Emulator UI
      - "5001:5001"  # Firebase Functions
      - "5002:5002"  # Firebase Hosting
      - "9001:9001"  # Firebase Database
      - "9099:9099"  # Firebase Auth
      - "8085:8085"  # Firebase PubSub

    networks:
      - agilepoker-network

    # Keep container running
    command: /bin/sh -c "while sleep 1000; do :; done"

    # Required for Docker-in-Docker
    privileged: true

networks:
  agilepoker-network:
    name: agilepoker-dev-network
    driver: bridge
